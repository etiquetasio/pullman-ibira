<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Sistema - Etiquetas.io</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            color: #222222;
        }

        .container {
            width: 100%;
            max-width: 720px;
            padding: 48px 40px;

            text-align: center;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }

        .alerta {
            margin: 0 0 36px;
            font-size: 25px;
            line-height: 1.5;
            font-weight: 600;
        }

        .botao {
            display: inline-block;
            width: 100%;
            max-width: 430px;
            padding: 22px 30px;

            font-size: 23px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;

            color: #ffffff;
            background: #d71920;
            border-radius: 12px;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .botao:hover {
            background: #b8141a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(215, 25, 32, 0.3);
        }

        .botao:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 36px 24px;
            }

            .alerta {
                font-size: 21px;
            }

            .botao {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <p class="alerta">
            Atenção Operador das etiquetas, o Airtable e os botões de sincronia
            foram descontinuados, por favor, acesse o novo sistema com o seu
            usuário no botão abaixo. Obrigado.
        </p>

        <a
            class="botao"
            href="https://buffet.etiquetas.io"
        >
            Acessar o novo sistema
        </a>
    </main>

</body>
</html>
